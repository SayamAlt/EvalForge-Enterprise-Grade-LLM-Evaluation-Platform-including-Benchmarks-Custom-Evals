[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalforge"
version = "0.1.0"
description = "Enterprise-grade LLM Evaluation & Benchmarking Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EvalForge" }]
keywords = ["llm", "evaluation", "benchmarking", "ai", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Cache / task queue
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    # LLM providers (Sprints 2-3)
    "openai>=1.35.0",
    "anthropic>=0.30.0",
    "google-genai>=1.0.0",
    "groq>=0.9.0",
    "mistralai>=1.0.0",
    # Token counting
    "tiktoken>=0.7.0",
    # HTTP client (tests + Ollama provider)
    "httpx>=0.27.0",
    # Logging
    "structlog>=24.2.0",
    # Config / file handling
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
# Local Ollama inference (no API key needed)
ollama = ["ollama>=0.2.0"]
# HuggingFace dataset loading — Sprint 4+
hf = [
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
    "Pillow>=10.0.0",
]
# NLP evaluation metrics — Sprint 5+
metrics = [
    "numpy>=1.26.0",
    "nltk>=3.8.0",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4.0",
    "evaluate>=0.4.0",
]
# Semantic similarity metrics (GPU-optional) — Sprint 5+
semantic = [
    "sentence-transformers>=3.0.0",
    "bert-score>=0.3.13",
    "torch>=2.3.0",
    "transformers>=4.41.0",
]
# LangChain / LangGraph pipeline support — Sprint 6+
langchain = [
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langgraph>=0.1.0",
]
# Experiment tracking — Sprint 5+
tracking = [
    "mlflow>=2.13.0",
]
# Observability / CLI — Sprint 8+
ops = [
    "rich>=13.7.0",
    "typer>=0.12.0",
    "prometheus-client>=0.20.0",
    "psutil>=5.9.0",
]


[tool.hatch.build.targets.wheel]
packages = ["app", "evalforge"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT"]
ignore = ["E501", "B008", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evalforge"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov=evalforge --cov-report=term-missing"

[tool.coverage.run]
source = ["app", "evalforge"]
omit = ["*/tests/*", "*/migrations/*", "alembic/*"]
