# EvalForge — Model Registry
# Pricing: USD per 1M tokens (input / output). Local models = 0.00.
# context_window: max input tokens the model accepts.
# type: "standard" | "reasoning" (reasoning models use extended thinking/CoT).
# tools: whether the model supports function/tool calling.

models:

  # OpenAI
  gpt-4o:
    provider: openai
    model_id: gpt-4o
    type: standard
    context_window: 128000
    tools: true
    pricing:
      input_per_1m: 5.00
      output_per_1m: 15.00

